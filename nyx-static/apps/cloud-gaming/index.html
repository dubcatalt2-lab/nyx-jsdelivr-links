  <body>
    <header class="topbar"> <a class="brand" href="/" data-home aria-label="Return to Nyx home">
        <img class="brand-mark" src="/gh/dubcatalt2-lab/nyx-jsdelivr-links@main/nyx-static/assets/icons/cloud-gaming.svg?v=2" alt="">
        <span><strong>Cloud Gaming</strong><small>Streaming library</small></span> </a>
      <div class="provider-state" data-provider-state><span></span><b>Checking provider</b></div>
    </header>
    <main>
      <section class="hero">
        <div>
          <p class="eyebrow">CLOUD GAMING</p>
          <h1>Choose a game.<br>Start playing.</h1>
          <p class="intro"> Select a title to start a cloud session.</p>
        </div>
        <div class="hero-orbit" aria-hidden="true"><span></span><i></i><b>
          </b></div>
      </section>
      <section class="catalog-shell" aria-labelledby="catalog-title">
        <div class="catalog-heading">
          <div>
            <p class="eyebrow">LIBRARY</p>
            <h2 id="catalog-title">Games</h2>
          </div>
          <div class="catalog-tools"> <label class="search"><span aria-hidden="true">⌕</span><input
                data-search type="search" placeholder="Search games" autocomplete="off"></label>
            <label class="tag-filter"><span class="sr-only">Filter by category</span><select
                data-tag>
                <option value="">All categories</option>
              </select></label> </div>
        </div> <label class="network-mode">Connection <select data-network-mode
            aria-describedby="network-help">
            <option value="auto">Automatic</option>
            <option value="restricted"> Restricted network</option>
          </select><small id="network-help"> Try Restricted network if this Wi-Fi cannot connect. It
            may add delay.</small></label>
        <div class="notice" data-notice role="status">Connecting to Nyx…</div>
        <div class="game-grid" data-grid aria-live="polite"></div>
        <p class="empty" data-empty hidden>No games match that search.</p>
      </section>
    </main>
    <section class="launch-layer" data-launch-layer hidden aria-live="assertive">
      <div class="launch-card">
        <div class="launch-spinner" aria-hidden="true"><span></span>
        </div>
        <p class="eyebrow">STARTING GAME</p>
        <h2 data-launch-title>Starting game</h2>
        <p data-launch-status> Connecting to the cloud provider…</p>
        <div class="launch-progress"><i data-launch-progress></i></div> <button class="secondary"
          data-cancel type="button">Cancel</button>
      </div>
    </section>
    <section class="player-layer" data-player-layer hidden>
      <header>
        <div><span class="live-dot" aria-hidden="true"></span><strong data-player-title> Cloud
            Gaming</strong><small data-player-time>Connecting</small></div>
        <nav aria-label="Player controls"> <button data-fullscreen type="button">Fullscreen</button>
          <button class="danger" data-close type="button">End session</button>
        </nav>
      </header> <iframe data-player title="Cloud game stream"
        allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write"
        referrerpolicy="strict-origin-when-cross-origin">
      </iframe>
    </section>
