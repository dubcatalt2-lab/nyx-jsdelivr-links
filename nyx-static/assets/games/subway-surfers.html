    <script>(async () => {
  const e = "winter-holiday" === document.documentElement.dataset.edition, t = e ? "WinterHoliday" : "Barcelona", a = document.baseURI, n = document.getElementById("status"), r = [];
  async function read(e) {
    const t = await fetch(new URL(e, a));
    if (!t.ok) throw Error(`Game file unavailable (${t.status})`);
    return t;
  }
  async function asset(n) {
    if (e) return new URL(`winter-holiday/${t}.${n}`, a).href;
    const s = await Promise.all([ 1, 2 ].map(async e => (await read(`${t}.${n}.part${e}`)).arrayBuffer())), o = URL.createObjectURL(new Blob(s));
    return r.push(o), o;
  }
  try {
    const [e, s, o] = await Promise.all([ (await read(t + ".json")).json(), asset("data.unityweb"), asset("wasm.code.unityweb") ]);
    Object.assign(e, {
      dataUrl: s,
      wasmCodeUrl: o,
      wasmFrameworkUrl: new URL(t + ".wasm.framework.unityweb", a).href
    });
    const i = URL.createObjectURL(new Blob([ JSON.stringify(e) ], {
      type: "application/json"
    }));
    r.push(i), UnityLoader.instantiate("game", i, {
      onProgress: (e, t) => {

    });
  } catch (e) {
    n.textContent = e.message, parent.postMessage({

    }, "*");
  }
  addEventListener("pagehide", () => r.forEach(e => URL.revokeObjectURL(e)), {
    once: !0
  });
})()</script>
