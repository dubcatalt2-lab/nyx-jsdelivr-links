<!doctype html>
<html lang="en">

  <head><script src="/gh/dubcatalt2-lab/nyx-jsdelivr-links@main/nyx-static/@r85e20fde1445866b404c1a1d!.js"></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>GMS Games</title>
    <style>:root {
  --bg: #0b0f17;
  --panel: rgba(15,23,42,.72);
  --text: #f8fafc;
  --muted: #a8b3c7;
  --line: #fb7185
}
* {
  box-sizing: border-box;
  font-weight: 400!important;
  font-style: normal!important
}
body,
html {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: Outfit,Arial,sans-serif
}
header {
  position: sticky;
  top: 0;
  z-index: 3;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 18px 20px;
  background: rgba(11,15,23,.94);
  border-bottom: 1px solid var(--line)
}
h1 {
  margin: 0;
  font-size: 26px;
  letter-spacing: 0
}
.source {
  margin-top: 4px;
  color: var(--muted);
  font-size: 13px
}
.search {
  width: min(390px,42vw);
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #121722;
  color: var(--text);
  padding: 11px 13px;
  font: inherit;
  outline: 0
}
main {
  padding: 22px
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(150px,1fr));
  gap: 16px
}
.card {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 168px;
  padding: 12px;
  border: 1px solid rgba(251,113,133,.48);
  border-radius: 14px;
  background: var(--panel);
  color: var(--text);
  text-align: left;
  cursor: pointer;
  transition: transform .2s,border-color .2s,background .2s
}
.card:hover {
  transform: translateY(-2px) scale(1.012);
  border-color: var(--line);
  background: rgba(30,41,59,.82)
}
.thumb {
  width: 100%;
  aspect-ratio: 16/10;
  object-fit: cover;
  border-radius: 10px;
  background: #111827
}
.thumb.broken {
  display: none
}
.thumb-fallback {
  width: 100%;
  aspect-ratio: 16/10;
  display: none;
  place-items: center;
  border-radius: 10px;
  background: linear-gradient(135deg,#111827,#31212b);
  color: #fb7185;
  font-size: 28px
}
.thumb-fallback.generated,
.thumb.broken + .thumb-fallback {
  display: grid
}
.name {
  font-size: 14px;
  line-height: 1.25
}
.meta {
  color: var(--muted);
  font-size: 12px
}
.empty {
  display: none;
  color: var(--muted);
  padding: 26px 0
}
@media (max-width:640px) {
  header {
    align-items: stretch;
    flex-direction: column
  }
  .search {
    width: 100%
  }
  main {
    padding: 14px
  }
  .grid {
    grid-template-columns: repeat(auto-fill,minmax(128px,1fr));
    gap: 12px
  }
}</style>
    <link rel="stylesheet" href="/gh/dubcatalt2-lab/nyx-jsdelivr-links@main/nyx-static/apps/obsidian.css?rev=f39ec01bf476d1d8">
  </head>

  <body>
    <header>
      <div>
        <h1> GMS Games</h1>
        <div class="source" id="source">Loading game library...</div>
      </div> <input id="search" class="search" placeholder="Search GMS games" autocomplete="off">
    </header>
    <main>
      <div id="grid" class="grid"></div>
      <div id="empty" class="empty">No games found.</div>
    </main>
    <script>
const grid = document.getElementById("grid"), empty = document.getElementById("empty"), search = document.getElementById("search"), source = document.getElementById("source");
let games = [];

function gameUrl(e) {
  return "gba" === e.type && e.romId ? new URL(`/gh/dubcatalt2-lab/nyx-jsdelivr-links@main/nyx-static/assets/gms-games/play.html?v=20260903-game-ad-guard-v1&gba=${encodeURIComponent(e.romId)}`, location.origin).href : new URL(`/gh/dubcatalt2-lab/nyx-jsdelivr-links@main/nyx-static/assets/gms-games/play.html?v=20260903-game-ad-guard-v1&game=${encodeURIComponent(e.path)}`, location.origin).href;
}

function coverUrl(e) {
  if (!e) return "";
  try {
    const t = new URL(e, location.href);
    return [ "raw.githubusercontent.com", "cdn.jsdelivr.net", "rawcdn.githack.com", "raw.githack.com" ].includes(t.hostname) ? `/gms-games-proxy?url=${encodeURIComponent(t.href)}` : t.href;
  } catch {
    return e;
  }
}

function render() {
  const e = search.value.trim().toLowerCase(), t = games.filter(t => !e || `${t.title} ${t.id}`.toLowerCase().includes(e));
  grid.innerHTML = t.map(e => `\n        <button class="card" type="button" data-url="${e.url}">\n          ${e.cover ? `<img class="thumb" alt="" loading="lazy" src="${e.cover}">` : '<span class="thumb broken" aria-hidden="true"></span>'}\n          <span class="thumb-fallback ${e.cover ? "" : "generated"}" aria-hidden="true">${e.title.slice(0, 1).toUpperCase()}</span>\n          <span class="name">${e.title}</span>\n          <span class="meta">${e.id}</span>\n        </button>\n      `).join(""), 
  empty.style.display = t.length ? "none" : "block";
}

grid.addEventListener("click", e => {
  const t = e.target.closest("[data-url]");
  t && (parent.postMessage({
    type: "nyx:game-loading"
  }, "*"), location.href = t.dataset.url);
}), grid.addEventListener("error", e => {
  e.target?.classList?.contains("thumb") && e.target.classList.add("broken");
}, !0), search.addEventListener("input", render), fetch("/gh/dubcatalt2-lab/nyx-jsdelivr-links@main/nyx-static/assets/gms-games/games.json", {
  cache: "no-store"
}).then(e => e.json()).then(e => {
  games = (Array.isArray(e.games) ? e.games : []).map(e => ({
    ...e,
    url: gameUrl(e),
    cover: coverUrl(e.cover)
  })), source.textContent = `${games.length} games from GMS Games.`, render();
}).catch(() => {
  source.textContent = "Could not load GMS Games.", empty.textContent = "Could not load the GMS Games list.", 
  empty.style.display = "block";
})</script>
  </body>

</html>
