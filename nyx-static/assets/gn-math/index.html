* {

  font-style: normal!important
}
body,
html {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: Outfit,Arial,sans-serif
}
header {
  position: sticky;
  top: 0;
  z-index: 3;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 18px 20px;
  background: rgba(11,15,23,.94);
  border-bottom: 1px solid var(--line)
}
h1 {
  margin: 0;
  font-size: 26px;
  letter-spacing: 0
}
.source {
  margin-top: 4px;
  color: var(--muted);
  font-size: 13px
}
.search {
  width: min(390px,42vw);
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #121722;
  color: var(--text);
  padding: 11px 13px;
  font: inherit;
  outline: 0
}
main {
  padding: 22px
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(150px,1fr));
  gap: 16px
}
.card {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 168px;
  padding: 12px;
  border: 1px solid rgba(167,139,250,.48);
  border-radius: 14px;
  background: var(--panel);
  color: var(--text);
  text-align: left;
  cursor: pointer;
  transition: transform .2s,border-color .2s,background .2s
}
.card:hover {
  transform: translateY(-2px) scale(1.012);
  border-color: var(--line);
  background: rgba(30,41,59,.82)
}
.thumb {
  width: 100%;
  aspect-ratio: 16/10;
  object-fit: cover;
  border-radius: 10px;
  background: #111827
}
.thumb.broken {
  display: none
}
.thumb-fallback {
  width: 100%;
  aspect-ratio: 16/10;
  display: none;
  place-items: center;
  border-radius: 10px;
  background: radial-gradient(circle at 20% 20%,rgba(167,139,250,.36),transparent 32%),radial-gradient(circle at 82% 76%,rgba(244,114,182,.28),transparent 34%),linear-gradient(135deg,#111827,#1e293b);
  color: #c4b5fd;
  font-size: 28px
}
.thumb-fallback.generated,
.thumb.broken+.thumb-fallback {
  display: grid
}
.name {
  font-size: 14px;
  line-height: 1.25
}
.meta {
  color: var(--muted);
  font-size: 12px
}
.empty {
  display: none;
  color: var(--muted);
  padding: 26px 0
}
@media (max-width:640px) {
  header {
    align-items: stretch;
    flex-direction: column
  }
  .search {
    width: 100%
  }
  main {
    padding: 14px
  }
  .grid {
    grid-template-columns: repeat(auto-fill,minmax(128px,1fr));
    gap: 12px
  }
}</style>
